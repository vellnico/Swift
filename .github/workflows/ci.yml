name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make xray
      - run: make lint
      - run: make test
      - run: make integration
      - run: make build

  install:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        base: ["debian:12", "ubuntu:24.04"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make xray build
      - run: scripts/test-install.sh "${{ matrix.base }}"

  e2e:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        xray: ["", "26.11.9"]
    name: e2e (xray ${{ matrix.xray || 'pinned' }})
    # newer Xray releases reject sing-box REALITY clients (SagerNet/sing-box#4520); kept as a canary
    continue-on-error: ${{ matrix.xray != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make xray XRAY_VERSION=${{ matrix.xray }}
      - run: make e2e

  golden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make xray
      - run: go test ./internal/sub/ -update -run 'TestSingBox|TestPresetGolden|TestAutoSelect|TestXrayJSON|TestBase64' || true
      - uses: actions/upload-artifact@v4
        with:
          name: golden
          path: internal/sub/testdata/
